// İstatistikler
const hesaplar = Object.values(CARI_DATA);
let toplamHareket = 0, pozitif = 0, negatif = 0;
hesaplar.forEach(h => {
  const moves = Object.values(h.hareketler||{});
  toplamHareket += moves.length;
  const borc = moves.reduce((s,m)=>s+m.borc,0);
  const alacak = moves.reduce((s,m)=>s+m.alacak,0);
  const bak = alacak - borc;
  if(bak > 0) pozitif++; else if(bak < 0) negatif++;
});
document.getElementById('toplam-hareket').textContent = toplamHareket.toLocaleString('tr-TR');
document.getElementById('pozitif-bakiye').textContent = pozitif;
document.getElementById('negatif-bakiye').textContent = negatif;

// Tablo
const tbody = document.getElementById('tablo');
let idx = 1;
hesaplar.forEach(h => {
  const moves = Object.values(h.hareketler||{});
  const borc = moves.reduce((s,m)=>s+m.borc,0);
  const alacak = moves.reduce((s,m)=>s+m.alacak,0);
  const bak = alacak - borc;
  const firma = h.firma || '';
  let badgeCls = 'badge-diger';
  if(['CARİ HESAPLAR','KASA CARİSİ'].includes(firma)) badgeCls='badge-cari';
  else if(firma==='MAAŞ') badgeCls='badge-maas';
  else if(['SERVİSCİLER','OKUL HESABI'].includes(firma)) badgeCls='badge-servis';
  
  const bakCls = bak > 0 ? 'bakiye-pos' : bak < 0 ? 'bakiye-neg' : '';
  const bakStr = bak === 0 ? '0' : (bak > 0 ? '+' : '') + bak.toLocaleString('tr-TR', {maximumFractionDigits:0});
  
  tbody.innerHTML += `<tr>
    <td style="color:rgba(255,255,255,.3);">${idx++}</td>
    <td style="font-weight:700;">${h.isim}</td>
    <td><span class="badge ${badgeCls}">${firma||'—'}</span></td>
    <td>${moves.length}</td>
    <td class="${bakCls}">${bakStr} ₺</td>
  </tr>`;
});

function showStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = ok ? 'status-ok' : 'status-err';
  el.style.display = 'block';
}

async function onaylaVeAktar() {
  // Firebase'e yaz
  const fbScript = document.createElement('script');
  fbScript.type = 'module';
  // Verileri doğrudan window'a bağla ve Firebase'e yaz
  window._importCariData = CARI_DATA;
  
  const progress = document.getElementById('progress');
  const bar = document.getElementById('progress-bar');
  progress.style.display = 'block';
  bar.style.width = '10%';
  
  try {
    // Firebase SDK'yı dynamic import ile yükle
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getDatabase, ref, get, set } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    
    bar.style.width = '30%';
    
    const existingApp = getApps().find(a => a.name === 'cari-import');
    const app = existingApp || initializeApp({
      apiKey: "AIzaSyD5n8hJLJy1wNfCgCR5r8l3OXzqyV8S9yw",
      authDomain: "konseltur-servis-5a6b8.firebaseapp.com",
      databaseURL: "https://konseltur-servis-5a6b8-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "konseltur-servis-5a6b8"
    }, 'cari-import');
    
    const db = getDatabase(app);
    bar.style.width = '50%';
    
    // Mevcut cari verilerini al
    const snap = await get(ref(db, 'konseltur/GLOBAL/cari'));
    const existing = (snap && snap.exists()) ? snap.val() : {};
    bar.style.width = '65%';
    
    // Birleştir — sadece yeni hesapları ekle, mevcutların üzerine yazma
    const merged = Object.assign({}, existing);
    const newData = window._importCariData;
    const keys = Object.keys(newData);
    let added = 0;
    keys.forEach(function(key) {
      if (!merged[key]) {
        merged[key] = newData[key];
        added++;
      }
    });
    
    bar.style.width = '80%';
    
    // Firebase'e yaz
    await set(ref(db, 'konseltur/GLOBAL/cari'), merged);
    
    // LocalStorage'a da yaz
    try { localStorage.setItem('konseltur_cari_v1', JSON.stringify(merged)); } catch(e2) {}
    
    bar.style.width = '100%';
    
    const statusEl = document.getElementById('status');
    statusEl.textContent = '✅ ' + added + ' yeni hesap aktarıldı (' + (keys.length - added) + ' zaten mevcuttu). Programı açıp Cari Hesaplar sayfasını yenileyin.';
    statusEl.className = 'status-ok';
    statusEl.style.display = 'block';
    
    document.querySelector('.btn-primary').disabled = true;
    document.querySelector('.btn-primary').style.opacity = '0.5';
    
  } catch(e) {
    bar.style.width = '0%';
    const statusEl = document.getElementById('status');
    statusEl.textContent = '❌ Hata: ' + e.message;
    statusEl.className = 'status-err';
    statusEl.style.display = 'block';
    console.error('Import hatası:', e);
  }
}
